server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/authdb
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET} #ẩn đi 
  expiration: 86400000

internal:
  api-key: ${INTERNAL_API_KEY}

# account-service gọi thẳng qua DNS nội bộ của docker-compose, không vòng qua gateway.
account-service:
  base-url: ${ACCOUNT_SERVICE_BASE_URL:http://account-service:8085}

# URL gốc hiển thị trong Swagger UI (trường `servers` của spec).
# Gateway không giữ Host header gốc nên phải khai báo tường minh,
# nếu không Swagger UI sẽ gọi thẳng host nội bộ và Try-it-out sẽ hỏng.
openapi:
  server-url: ${OPENAPI_SERVER_URL:http://localhost:8080}
