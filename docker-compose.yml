services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: paymentdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ibanking-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ibanking-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  auth-service:
    build: ./auth-service
    container_name: ibanking-auth
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  tuition-service:
    build: ./tuition-service
    container_name: ibanking-tuition
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    container_name: ibanking-payment
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  notification-service:
    build: ./notification-service
    container_name: ibanking-notification
    ports:
      - "8084:8084"
    environment:
      RABBITMQ_HOST: rabbitmq
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    depends_on:
      rabbitmq:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    container_name: ibanking-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_HOST: auth-service
      TUITION_HOST: tuition-service
      PAYMENT_HOST: payment-service
    depends_on:
      - auth-service
      - tuition-service
      - payment-service

  # Nếu bạn có frontend, bỏ comment:
  # frontend-ui:
  #   build: ./frontend-ui
  #   container_name: ibanking-frontend
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - api-gateway

volumes:
  postgres_data: