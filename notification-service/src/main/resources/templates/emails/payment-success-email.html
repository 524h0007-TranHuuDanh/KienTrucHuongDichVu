<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Thanh toán thành công</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f7fa; padding:40px 16px;">
        <tr>
            <td align="center">
                <!-- Main Container -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.05); mso-table-lspace:0pt; mso-table-rspace:0pt;">
                    
                    <!-- Header (Màu xanh lá sang trọng) -->
                    <tr>
                        <td style="background-color:#10b981; padding:40px 32px; text-align:center;">
                            <div style="font-size:48px; line-height:1; margin-bottom:12px;">✅</div>
                            <div style="color:#ffffff; font-size:24px; font-weight:700; letter-spacing:0.5px;">
                                Thanh toán thành công
                            </div>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding:40px 32px;">
                            <p style="color:#4b5563; font-size:14px; line-height:1.6; margin:0 0 20px 0;">
                                Bạn đã thanh toán học phí thành công cho
                                <strong style="color:#111827;" th:text="${studentName}">Nguyễn Văn A</strong>.
                                Chi tiết giao dịch:
                            </p>

                            <!-- Bảng chi tiết giao dịch (Thiết kế dạng Receipt) -->
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; overflow:hidden;">
                                <!-- Row 1: Số tiền -->
                                <tr>
                                    <td style="padding:20px 24px; border-bottom:1px solid #e2e8f0;">
                                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td style="color:#64748b; font-size:15px; vertical-align:middle;">💰 Số tiền đã đóng</td>
                                                <td align="right" style="color:#0f172a; font-weight:700; font-size:18px; vertical-align:middle;" th:text="${#numbers.formatDecimal(amount,0,'COMMA',0,'POINT')} + ' VNĐ'">8.500.000 VNĐ</td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                                <!-- Row 2: Mã giao dịch (Đã xóa số dư) -->
                                <tr>
                                    <td style="padding:20px 24px;">
                                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td style="color:#64748b; font-size:15px; vertical-align:top; width:40%;">🧾 Mã giao dịch</td>
                                                <td align="right" style="color:#334155; font-family:'Courier New', Courier, monospace; font-size:13px; font-weight:600; vertical-align:top; word-break:break-all;" th:text="${transactionId}">
                                                    0a8cf4a8-a11c-4dc9-96b0-cc5f073c8546
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            <!-- Lời cảm ơn -->
                            <div style="text-align:center; margin-top:32px;">
                                <p style="color:#64748b; font-size:14px; margin:0;">
                                    Cảm ơn bạn đã sử dụng dịch vụ của <strong>TDTU iBanking</strong> 🎓
                                </p>
                            </div>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background-color:#f8fafc; padding:24px 32px; text-align:center; border-top:1px solid #e2e8f0;">
                            <span style="color:#94a3b8; font-size:13px; line-height:1.5; display:block;">
                                © 2026 TDTU iBanking · Email tự động, vui lòng không trả lời.
                            </span>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
