server:
  port: 8085

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/accountdb
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

internal:
  api-key: ${INTERNAL_API_KEY}

# Chỉ bật đúng endpoint "health" ra ngoài, dùng cho healthcheck của docker-compose
# (account-service không lộ ra api-gateway nên không cần siết thêm bằng internal key
# cho riêng endpoint này).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
