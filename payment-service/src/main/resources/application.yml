server:
  port: 8083 

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/paymentdb
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

jwt:
  secret: ${JWT_SECRET}

internal:
  api-key: ${INTERNAL_API_KEY}

# URL gốc hiển thị trong Swagger UI (trường `servers` của spec).
# Gateway không giữ Host header gốc nên phải khai báo tường minh,
# nếu không Swagger UI sẽ gọi thẳng host nội bộ và Try-it-out sẽ hỏng.
openapi:
  server-url: ${OPENAPI_SERVER_URL:http://localhost:8080}
