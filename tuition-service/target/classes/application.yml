server:
  port: 8082

spring:
  application:
    name: tuition-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/tuitiondb
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET}

internal:
  api-key: ${INTERNAL_API_KEY}

# URL gốc hiển thị trong Swagger UI (trường `servers` của spec).
# Gateway không giữ Host header gốc nên phải khai báo tường minh,
# nếu không Swagger UI sẽ gọi thẳng host nội bộ và Try-it-out sẽ hỏng.
openapi:
  server-url: ${OPENAPI_SERVER_URL:http://localhost:8080}
