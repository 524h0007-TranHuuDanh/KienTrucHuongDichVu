server:
  port: 8082

spring:
  application:
    name: tuition-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/tuitiondb
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always