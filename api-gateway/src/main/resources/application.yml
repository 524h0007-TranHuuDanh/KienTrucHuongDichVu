server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://${AUTH_HOST:localhost}:8081
          predicates:
            - Path=/api/auth/**
        - id: tuition-service
          uri: http://${TUITION_HOST:localhost}:8082
          predicates:
            - Path=/api/tuition/**
        - id: payment-service
          uri: http://${PAYMENT_HOST:localhost}:8083
          predicates:
            - Path=/api/payments/**