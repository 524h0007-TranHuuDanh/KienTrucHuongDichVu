server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
        - id: tuition-service
          uri: http://tuition-service:8082
          predicates:
            - Path=/api/tuition/**
        - id: payment-service
          uri: http://payment-service:8083
          predicates:
            - Path=/api/payments/**

jwt:
  secret: ${JWT_SECRET}