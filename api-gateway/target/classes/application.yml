server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
        - id: tuition-service
          uri: http://tuition-service:8082
          predicates:
            - Path=/api/tuition/**
        - id: payment-service
          uri: http://payment-service:8083
          predicates:
            - Path=/api/payments/**

jwt:
  secret: ${JWT_SECRET}